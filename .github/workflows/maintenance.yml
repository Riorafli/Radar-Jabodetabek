name: maintenance
on:
  schedule:
    - cron: "30 19 * * *"   # every day 02:30 WIB
  push:
    branches: [main]
    paths: ["config/**"]
  workflow_dispatch:
jobs:
  sync-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pipeline.sync_config
      - name: cleanup (daily; not on config pushes)
        if: github.event_name != 'push'
        run: python -m pipeline.cleanup
        env:
          RETENSI_BERITA_HARI: ${{ vars.RETENSI_BERITA_HARI }}
          RETENSI_POST_HARI: ${{ vars.RETENSI_POST_HARI }}
