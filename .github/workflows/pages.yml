name: pages
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # cache-busting: every deploy points index.html at fresh copies of the assets,
      # so browsers never mix a new page with an old cached app.js/style.css
      - name: version asset links
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"(app\.js|style\.css|config\.js|demo\.js)\"#\1=\"\2?v=${v}\"#g" web/index.html
          grep -oE '(app\.js|style\.css|config\.js|demo\.js)\?v=[0-9a-f]+' web/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: deploy
        uses: actions/deploy-pages@v4