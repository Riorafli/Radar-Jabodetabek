name: news
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency: { group: news, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m collectors.rss
      - run: python -m collectors.bmkg
        continue-on-error: true
      - run: python -m collectors.gdelt
        continue-on-error: true
      - run: python -m collectors.trends_now
        continue-on-error: true
      - run: python -m pipeline.dedup
      - run: python -m pipeline.geocode
        continue-on-error: true
