# Viral score per zone (Blueprint section 9):
#   skor = w_mention * z(mention 24h vs 14-day daily mean in the same zone)
#        + w_engagement * engagement growth (log ratio, views/likes)
#        + w_platform * number of different platforms
#        + bonus for user reports (capped)
# Review the top list weekly and tune these numbers.

bobot:
  mention: 0.5
  engagement: 0.3
  platform: 0.2

# Minimum before an entity may appear in the viral list
# (one post must not make something "viral").
min_mention_24j: 3
min_sumber: 2

bonus_per_laporan: 0.1
bonus_maks: 0.5

# Sources that count as a "mention"
sumber_mention: [youtube, berita, reddit]

# trends ratio (last day / previous days) above this counts as an extra platform
trends_naik: 1.3

# keep this many entries per zone
top_per_zona: 50

# Telegram notification threshold (pipeline/notify.py)
notif_min_skor: 1.5
notif_top: 5
