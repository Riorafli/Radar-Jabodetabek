# Brand names + aliases. Used to (1) normalize entity names for viral scoring
# ("kokenang" -> Kopi Kenangan), (2) tag promos and news with a brand, and
# (3) food-promo filters:
#   jenis: minuman | makanan | campuran   (default when the promo text says nothing)
#   halal: true  -> brand holds an Indonesian halal certificate (BPJPH/MUI)
#          false -> brand is known non-halal
#          (leave out when unsure - the site then shows no halal label)
# Halal status changes over time: re-check at https://bpjph.halal.go.id
# before adding or keeping `halal: true`. Aliases are lowercase, whole-word.

brand:
  - nama: Kopi Kenangan
    alias: [kopi kenangan, kopken, kokenang, kenangan coffee]
    jenis: minuman
    halal: true
  - nama: Janji Jiwa
    alias: [janji jiwa, kopi janji jiwa, jiwa toast]
    jenis: minuman
  - nama: Fore Coffee
    alias: [fore coffee, kopi fore]
    jenis: minuman
  - nama: Tomoro Coffee
    alias: [tomoro, tomoro coffee]
    jenis: minuman
  - nama: Point Coffee
    alias: [point coffee, indomaret point]
    jenis: minuman
  - nama: Starbucks
    alias: [starbucks, sbux]
    jenis: minuman
  - nama: Mixue
    alias: [mixue]
    jenis: campuran
    halal: true
  - nama: Es Teh Indonesia
    alias: [es teh indonesia, esteh indonesia]
    jenis: minuman
    halal: true
  - nama: Chatime
    alias: [chatime]
    jenis: minuman
  - nama: Mie Gacoan
    alias: [mie gacoan, gacoan]
    jenis: makanan
  - nama: McDonald's
    alias: [mcdonald's, mcdonalds, mcd, mekdi]
    jenis: makanan
    halal: true
  - nama: KFC
    alias: [kfc]
    jenis: makanan
    halal: true
  - nama: HokBen
    alias: [hokben, hoka hoka bento]
    jenis: makanan
    halal: true
  - nama: Richeese Factory
    alias: [richeese factory, richeese]
    jenis: makanan
    halal: true
  - nama: Pizza Hut
    alias: [pizza hut]
    jenis: makanan
    halal: true
  - nama: Burger King
    alias: [burger king]
    jenis: makanan
    halal: true
  - nama: Solaria
    alias: [solaria]
    jenis: makanan
    halal: true
  - nama: Haidilao
    alias: [haidilao, hai di lao]
    jenis: makanan
  - nama: Sate Khas Senayan
    alias: [sate khas senayan]
    jenis: makanan
  - nama: Bakmi GM
    alias: [bakmi gm, bakmi gajah mada]
    jenis: makanan
  - nama: Gyukatsu Kyoto Katsugyu
    alias: [katsugyu]
    jenis: makanan
  - nama: Sushi Tei
    alias: [sushi tei]
    jenis: makanan
  - nama: Marugame Udon
    alias: [marugame, marugame udon]
    jenis: makanan
  - nama: Wingstop
    alias: [wingstop]
