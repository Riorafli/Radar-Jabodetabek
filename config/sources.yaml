# Data sources. Every URL below was tested on 2026-10-08 (HTTP 200 + parsable).
#
# rss.filter_wilayah: true  -> national feed, keep only items that mention a
#                              Jabodetabek place (wilayah.yaml / zones.yaml)
#                     false -> local feed, keep everything
# rss.default_wilayah:       kode used when a local item mentions no place
# rss.tipe:                  berita (default) | info (public service: weather, transit)

rss:
  - nama: Detik News
    url: https://news.detik.com/berita/rss
    filter_wilayah: true
  - nama: detikFood
    url: https://food.detik.com/rss
    filter_wilayah: true
  # Antara "megapolitan"/"metro" also carry national stories -> filtered too
  - nama: Antara Megapolitan
    url: https://megapolitan.antaranews.com/rss/terkini.xml
    filter_wilayah: true
  - nama: Antara Metro
    url: https://www.antaranews.com/rss/metro.xml
    filter_wilayah: true
  - nama: CNN Indonesia
    url: https://www.cnnindonesia.com/nasional/rss
    filter_wilayah: true
  - nama: CNN Indonesia Gaya Hidup
    url: https://www.cnnindonesia.com/gaya-hidup/rss
    filter_wilayah: true
  - nama: CNBC Indonesia
    url: https://www.cnbcindonesia.com/news/rss
    filter_wilayah: true
  - nama: Tempo
    url: https://rss.tempo.co/nasional
    filter_wilayah: true
  - nama: Okezone
    url: https://www.okezone.com/rss
    filter_wilayah: true
  - nama: Republika
    url: https://www.republika.co.id/rss
    filter_wilayah: true
  # Local outlets also carry national/entertainment news -> filtered too
  - nama: Radar Bekasi
    url: https://radarbekasi.id/feed
    filter_wilayah: true
  - nama: Tangerang News
    url: https://www.tangerangnews.com/rss
    filter_wilayah: true
  # Not working on 2026-10-08 (re-check later): Kompas megapolitan (404),
  # Tempo metro (403), Radar Bogor (timeout), Radar Depok (connection error).

# BMKG nowcast (weather warnings), filtered to Jabodetabek provinces/regions.
bmkg:
  nowcast_url: https://www.bmkg.go.id/alerts/nowcast/id
  provinsi: [DKI Jakarta, Jawa Barat, Banten]

# GDELT DOC API: free, no key, max 1 request / 5 s. Extra coverage only.
gdelt:
  aktif: true
  query: '(jakarta OR bekasi OR depok OR tangerang OR bogor) sourcecountry:indonesia'
  timespan: 2h
  maxrecords: 75

# Promo pages. The collector checks robots.txt before every fetch and only
# calls the LLM when the page text changed. selector = CSS selector of the
# promo area (empty = whole <body>). Pages that need JavaScript return almost
# no text; those stay aktif: false - use /tambah_promo in the bot instead.
promo:
  - nama: McDonald's
    brand: McDonald's
    url: https://www.mcdonalds.co.id/promo
    selector: ""
    aktif: true
  - nama: HokBen
    brand: HokBen
    url: https://www.hokben.co.id/promo
    selector: ""
    aktif: true
  - nama: Richeese Factory
    brand: Richeese Factory
    url: https://www.richeesefactory.com/promo
    selector: ""
    aktif: true
  - nama: BCA
    brand: ""            # bank promo: brand comes from the LLM per promo
    url: https://www.bca.co.id/id/promo-bca
    selector: ""
    aktif: true
  - nama: Bank Mandiri
    brand: ""
    url: https://www.bankmandiri.co.id/promo
    selector: ""
    aktif: true
  - nama: ShopeePay
    brand: ""
    url: https://shopeepay.co.id/promo
    selector: ""
    aktif: true
  # JS-rendered or broken on 2026-10-08 - enable after finding a static URL:
  - {nama: KFC, brand: KFC, url: https://kfcku.com/promo, selector: "", aktif: false}
  - {nama: Pizza Hut, brand: Pizza Hut, url: https://www.pizzahut.co.id/promo, selector: "", aktif: false}
  - {nama: Domino's, brand: Domino's, url: https://www.dominos.co.id/promo, selector: "", aktif: false}
  - {nama: Starbucks, brand: Starbucks, url: https://www.starbucks.co.id/promotions, selector: "", aktif: false}
  - {nama: Grand Indonesia, brand: "", url: https://www.grand-indonesia.com/, selector: "", aktif: false}

# Shopping promos (collectors/belanja.py): marketplace promos + cuci gudang /
# warehouse sale / bazar. Marketplaces have no public feed and forbid scraping,
# so promos come from the official RSS of news outlets (robots.txt allows).
# These feeds are read IN ADDITION to every feed in `rss` above.
belanja:
  max_artikel_per_run: 24
  rss:
    - nama: Wolipop
      url: https://wolipop.detik.com/rss
    - nama: detikInet
      url: https://inet.detik.com/rss
    - nama: detikFinance
      url: https://finance.detik.com/rss
    - nama: CNN Indonesia Ekonomi
      url: https://www.cnnindonesia.com/ekonomi/rss
    - nama: CNN Indonesia Teknologi
      url: https://www.cnnindonesia.com/teknologi/rss
    - nama: CNBC Indonesia Tech
      url: https://www.cnbcindonesia.com/tech/rss
    - nama: Antara Tekno
      url: https://www.antaranews.com/rss/tekno.xml
    - nama: Tempo Bisnis
      url: https://rss.tempo.co/bisnis
  # Official store / mall promo pages (tested 2026-10-15: open, robots.txt
  # allows, readable without JavaScript). Read hourly; the LLM only runs when
  # the page text changes. lokasi/kota = default when a promo names no branch.
  halaman:
    - nama: Matahari
      url: https://www.matahari.com/promo
      lokasi: Semua toko Matahari
    - nama: Hypermart
      url: https://www.hypermart.co.id/promo
      lokasi: Semua toko Hypermart
      aktif: false   # page last updated Dec 2022 (checked 2026-10-15)
    - nama: IKEA
      url: https://www.ikea.co.id/in/penawaran
      lokasi: Semua toko IKEA
    - nama: Kota Kasablanka
      url: https://www.kotakasablanka.co.id/events
      lokasi: Kota Kasablanka
      kota: Jakarta Selatan
  # Not available on 2026-10-15 (404 / JS-only / errors): Transmart, ACE,
  # Informa, Sogo, Erafone, Pondok Indah Mall, Central Park.

  # Automatic shopping finds from YouTube (uses YOUTUBE_API_KEY). Every
  # `setiap_jam` hours each group runs `per_run` searches (~100 units each):
  # 2 groups x 8 runs/day = 16 searches/day.
  youtube:
    setiap_jam: 3
    max_results: 15
    grup:
      # tested 2026-10-13: Indonesian product videos ("racun tokopedia",
      # "promo lazada" return almost nothing; "shopee haul" is mostly Brazil)
      - nama: marketplace
        per_run: 1
        urut: viewCount
        hari: 3
        min_views: 2000
        queries:
          - racun shopee
          - racun tiktok shop
          - flash sale shopee
          - spill produk tiktok shop
          - racun shopee murah
          - barang viral shopee
      # tested 2026-10-15: Tanah Abang clearance, dealer year-end clearance,
      # store warehouse sales. Few views, so newest first and a low view floor.
      # ("bazar diskon", "obral besar", "midnight sale mall" return nothing)
      - nama: cuci_gudang
        per_run: 1
        urut: date
        hari: 7
        min_views: 30
        # markets/showrooms run these sales for days: assume 7 days when no end date
        # (news items keep 3 days - those are usually one-day events)
        berlaku_hari: 7
        queries:
          - cuci gudang jakarta
          - warehouse sale jakarta
          - cuci gudang bekasi
          - cuci gudang tangerang
          - cuci gudang depok
          - cuci gudang bogor
  # Not used on purpose: Google News RSS (robots.txt disallows bots),
  # Shopee/Tokopedia/Lazada pages (ToS forbids scraping, JS-only).

# YouTube Data API. Each search costs ~100 units (quota 10,000/day).
# The collector runs every 2 h and uses `per_run` queries per run, rotating
# through the list -> 12 runs x 4 = 48 searches/day (~4,900 units).
youtube:
  per_run: 4
  max_results: 25
  queries:
    - kuliner viral jakarta
    - tempat nongkrong baru jakarta selatan
    - kuliner viral bsd
    - cafe baru bsd serpong
    - kuliner viral depok margonda
    - kuliner viral bekasi
    - kuliner viral tangerang
    - kuliner viral bogor
    - cafe viral pik
    - kuliner blok m
    - kuliner kelapa gading
    - makanan viral jabodetabek
    - antri panjang makanan jakarta
    - cafe hits bintaro
    - kuliner malam jakarta
    - street food jakarta terbaru
    - kuliner kemang terbaru
    - cafe baru pik
    - kuliner gading serpong
    - kuliner alam sutera
    - jajanan viral bekasi
    - tempat makan baru depok
    - kuliner jakarta barat viral
    - kuliner jakarta timur viral

# Google Trends via pytrends (unofficial; treated as bonus).
trends:
  geo: [ID-JK, ID-JB, ID-BT]
  # brands from brands.yaml are checked in groups of 5 (Trends limit)
  max_brand: 15

# Google Trends "Trending Now" (public RSS, no key). General topics for
# Indonesia, shown as "Lagi dicari di Google" in the Viral tab; searches that
# name a brand from brands.yaml also count as a viral mention ('gtrends').
google_trends_now:
  url: https://trends.google.com/trending/rss?geo=ID

# Reddit (optional; needs REDDIT_CLIENT_ID/SECRET, app-only OAuth).
reddit:
  subreddits: [indonesia, jakarta]
  limit: 50

# OSM Overpass: cafes/restaurants per zone. Public server - be gentle.
osm:
  endpoint: https://overpass-api.de/api/interpreter
  amenity: [cafe, restaurant, fast_food, food_court, ice_cream]
