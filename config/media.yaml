# Press verification for news sources (Berita tab).
# Source: Dewan Pers "Data Perusahaan Pers" (https://dewanpers.or.id/data), checked 2026-11-03.
#   faktual        Terverifikasi Faktual (highest level)
#   administratif  Terverifikasi Administratif
#   resmi          official government agency (not a press company)
# A domain also covers its subdomains (news.detik.com -> detik.com).
# Sources NOT listed here are shown with "Belum terverifikasi Dewan Pers"
# (checked 2026-11-03: radarbekasi.id, tangerangnews.com, koran-jakarta.com not found).
# Re-check yearly: verification can expire or be added.

